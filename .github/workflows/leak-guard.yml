# Leak guard: fail when the repo, or any commit in its history, holds Facebook
# cookies, age keys, fbm output, a Messenger export or a blocked file. It
# reads the repo only and uses no secrets: no Go tests, no fbm, and nothing it
# prints shows a matched value. The owner's private strings stay local
# (.check-public.local, used by the hooks, export-public.sh and manual runs):
# anyone who can push could edit this workflow to print a secret it was given.
name: leak-guard

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's
      # gitleaks_8.30.1_checksums.txt. The install step refuses anything else.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned version, sha256 verified)
        run: |
          set -euo pipefail
          case "$GITLEAKS_SHA256" in
          *[!0-9a-f]* | "") echo "::error::GITLEAKS_SHA256 is not a sha256; set it from the release checksums file"; exit 1 ;;
          esac
          if [ "${#GITLEAKS_SHA256}" -ne 64 ]; then
            echo "::error::GITLEAKS_SHA256 is not 64 hex digits"
            exit 1
          fi
          dir=$RUNNER_TEMP/gitleaks
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          mkdir -p "$dir"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$dir/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" gitleaks
          echo "$dir" >>"$GITHUB_PATH"

      - name: gitleaks over the full history
        run: |
          set -euo pipefail
          # Findings print as commit, file, line and rule: never the secret.
          printf '{{range .}}{{.Commit}} {{.File}}:{{.StartLine}}: gitleaks {{.RuleID}}\n{{end}}' >"$RUNNER_TEMP/gitleaks.tpl"
          gitleaks git --config .gitleaks.toml --redact --no-banner --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-ignore-file" --exit-code 1 \
            --report-format template --report-template "$RUNNER_TEMP/gitleaks.tpl" --report-path - .

      - name: check-public.sh over the tree
        run: bash scripts/check-public.sh --quiet-hits
